<body>
    <h1>Extraction des transactions Sytral</h1>

        <h3>CSV Monetico_Retail_remisées (;)</h3>
        <input type="file" name="file_monetico_remisees" id="file_monetico" accept=".csv">
        <h3>CSV Monetico_Retail_en_cours (;)</h3>
        <input type="file" name="file_monetico_encours" id="file_monetico" accept=".csv">
        <h3>CSV Conduent (;)</h3>
        <input type="file" name="file_conduent" id="file_conduent" accept=".csv">
        <br />
        <br />
        <br />
        <button type="submit">Soumettre</button>
    </form>
